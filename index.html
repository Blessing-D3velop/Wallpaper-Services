<!DOCTYPE html>
<html>
  <head>
    <title>Shepard Wallpapers</title>
    <link rel="stylesheet" href="Styles/main.css">
    <link rel="stylesheet" href="Styles/header.css">
    <link rel="stylesheet" href="Styles/home.css">
    <link rel="stylesheet" href="Styles/services.css">
    <link rel="stylesheet" href="Styles/shared.css">
    <link rel="stylesheet" href="Styles/our-work.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <header class="header">
      <div class="left section">
        <h1>Shepard Wallpapers</h1>
      </div>
      <div class="right-section">
        <nav class="navigation">
          <p>Home</p>
          <p>Services</p>
          <p>Gallery</p>
          <p>About</p>
          <p>Contact</p>
          <button class="quote-button">Get a Quote</button>  
        </nav>
        <div class="hamburger">&#9776</div> 
      </div>
    </header>
    <main class="main-container">
      <section class="home-page">
        <div class="home-page-image-container">
          <img src="Images & Icons/Images/PICTLAV0101.webp" alt="home-page-image" class="home-page-wallpaper-image">
        </div>
        <div class="home-page-info-container">
          <h2>Professional Wallpaper Installation Services</h2>
          <p class="home-label">Transform your space with expert wallpaper installation</p>
          <p class="location-text">
            <img src="Images & Icons/Icons/icons8-location-pin-32.png" alt="location icon" class="loaction-icon">
            Serving all over South Africa
          </p>
          <div class="main-page-buttons-container">
            <button class="quote-button-two">Get a Quote</button> 
            <button class="view-our-work-button">View our Work</button>
          </div>
        </div>
      </section>


      <section class="our-services-section">
        <p class="header-label">Our Services</p>
        <div class="services-container js-services-container">
        </div>
      </section>

      <section class="our-work-section">
        <p class="header-label">Our Work</p>
        <p class="our-work-description">Real transformations that speak for themselves</p>
        <div class="work-images-container">
          <img src="Images & Icons/Images/Our-Work-Section-Images/Screenshot 2026-04-14 204820.png" alt="Work image" class="work-image">
          <img src="Images & Icons/Images/Our-Work-Section-Images/Screenshot 2026-04-14 204828.png" alt="Work image" class="work-image">
          <img src="Images & Icons/Images/Our-Work-Section-Images/Screenshot 2026-04-14 204835.png" alt="Work image" class="work-image">
          <img src="Images & Icons/Images/Our-Work-Section-Images/Screenshot 2026-04-14 204844.png" alt="Work image" class="work-image">
          <img src="Images & Icons/Images/Our-Work-Section-Images/Screenshot 2026-04-14 204850.png" alt="Work image" class="work-image">
          <img src="Images & Icons/Images/Our-Work-Section-Images/Screenshot 2026-04-14 204922.png" alt="Work image" class="work-image">
        </div>
      </section>
    </main>
    <script src="header.js"></script>
    <script type="module" src="Scripts/home-section.js"></script>
  </body>
</html>
